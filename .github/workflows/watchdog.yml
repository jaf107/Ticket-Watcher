# Pings the hosted watcher and alerts if it stops watching.
#
# The hosted app does the actual ticket checking; this only answers "is it
# still alive?". Without it, a crashed container is indistinguishable from a
# quiet week with no new dates.
name: Watchdog

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check hosted watcher
        env:
          URL: ${{ vars.HEALTHCHECK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          if [ -z "${URL}" ]; then
            echo "HEALTHCHECK_URL variable is not set — nothing deployed to watch yet."
            exit 0
          fi

          body=$(curl -sS -m 20 "${URL}" || true)
          echo "health response: ${body:-<empty>}"

          running=$(printf '%s' "$body" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('running'))" 2>/dev/null \
            || echo "unreachable")

          if [ "$running" = "True" ]; then
            echo "Healthy — monitor is running."
            exit 0
          fi

          echo "Unhealthy: running=${running}"
          curl -sS -m 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Ticket Watcher is not watching (health: ${running}). Check ${URL}" \
            > /dev/null
          exit 1
