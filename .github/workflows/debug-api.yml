# Temporary diagnostic: shows what the CineplexBD APIs return from a GitHub
# runner IP. Delete once the blocking behaviour is understood.
name: Debug API

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe web API
        run: |
          echo "=== egress IP ==="
          curl -sS -m 20 https://api.ipify.org || true; echo

          echo "=== web login ==="
          curl -sS -m 25 -o /tmp/login.txt -w "status=%{http_code} type=%{content_type}\n" \
            -X POST "https://cineplex-web-api.cineplexbd.com/api/v1/login" \
            -H "Content-Type: application/json" \
            -H "Origin: https://www.cineplexbd.com" \
            -H "Referer: https://www.cineplexbd.com/" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            -d '{"user_id":"ciprobe1785400000000"}' || true
          echo "--- first 400 bytes ---"; head -c 400 /tmp/login.txt; echo

          echo "=== movie-show-time ==="
          curl -sS -m 25 -o /tmp/mst.txt -w "status=%{http_code} type=%{content_type}\n" \
            -X POST "https://cineplex-web-api.cineplexbd.com/api/v1/movie-show-time" \
            -H "Content-Type: application/json" \
            -H "Origin: https://www.cineplexbd.com" \
            -H "Referer: https://www.cineplexbd.com/" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36" \
            -d '{"location":3,"date_from":"2026-07-30","date_to":"2026-08-20"}' || true
          echo "--- first 400 bytes ---"; head -c 400 /tmp/mst.txt; echo

          echo "=== plain GET of site (WAF check) ==="
          curl -sS -m 20 -o /dev/null -w "www status=%{http_code}\n" https://www.cineplexbd.com/ || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Can a real browser get past Cloudflare?
        run: |
          pip install --quiet playwright httpx
          playwright install chromium --with-deps > /dev/null 2>&1
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          captured = []
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch(headless=True)
                  page = await b.new_page()

                  async def on_resp(r):
                      if "movie-show-time" in r.url:
                          try: captured.append((r.status, (await r.text())[:200]))
                          except Exception as e: captured.append((r.status, f"<unreadable {e}>"))
                  page.on("response", lambda r: asyncio.ensure_future(on_resp(r)))

                  await page.goto("https://www.cineplexbd.com/show-time",
                                  wait_until="domcontentloaded", timeout=60000)
                  await page.wait_for_timeout(15000)
                  print("page title:", await page.title())
                  await b.close()
              print("movie-show-time responses captured:", len(captured))
              for status, body in captured:
                  print(f"  [{status}] {body[:200]}")
          asyncio.run(main())
          PY
